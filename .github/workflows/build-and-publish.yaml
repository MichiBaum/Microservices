name: Build and Publish

on:
  push:
    tags:
      - '*'

jobs:
  build:
    name: 'Build and publish docker containers'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '26'
          cache: 'maven'
          cache-dependency-path: |
            **/pom.xml
          check-latest: true

      - name: Cache Jib layers
        uses: actions/cache@v4
        with:
          path: ~/.cache/google-cloud-tools-java/jib
          key: ${{ runner.os }}-jib-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-jib-

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          check-latest: true
          cache-dependency-path: website/package-lock.json

      - name: Determine tag
        id: determine_tag
        run: |
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            echo "DOCKER_TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
          else
            echo "DOCKER_TAG=latest" >> $GITHUB_ENV
          fi

      - name: Angular install
        run: npm --prefix ./website install ./website

      - name: Angular build
        run: npm run --prefix website build-production

      - name: Maven package and publish
        run: ./mvnw --batch-mode --no-transfer-progress package -Ppublish-image -DskipTests -DdockerHub.username=${{secrets.DOCKER_USERNAME}} -DdockerHub.password=${{secrets.DOCKER_PASSWORD}} -Djib.to.tags=${{ env.DOCKER_TAG }}