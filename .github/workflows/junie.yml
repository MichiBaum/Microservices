name: Junie

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  junie:
    if: |
      (
        (github.event_name == 'issue_comment' && contains(fromJSON('["OWNER", "COLLABORATOR"]'), github.event.comment.author_association) && contains(github.event.comment.body, '@junie-agent')) ||
        (github.event_name == 'pull_request_review_comment' && contains(fromJSON('["OWNER", "COLLABORATOR"]'), github.event.comment.author_association) && contains(github.event.comment.body, '@junie-agent')) ||
        (github.event_name == 'pull_request_review' && contains(fromJSON('["OWNER", "COLLABORATOR"]'), github.event.review.author_association) && contains(github.event.review.body, '@junie-agent')) ||
        (github.event_name == 'issues' && contains(fromJSON('["OWNER", "COLLABORATOR"]'), github.event.issue.author_association) && (contains(github.event.issue.body, '@junie-agent') || contains(github.event.issue.title, '@junie-agent')))
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Junie
        id: junie
        uses: JetBrains/junie-github-action@7e0a3d3059e38bcd2ae3d2d366726df45663d5ae # 1.8.0
        with:
          base_branch: 'develop'
          model: 'gemini-flash'
          junie_api_key: ${{ secrets.JUNIE_API_KEY }} # Change to the vendor key in case of BYOK, e.g. `anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}`