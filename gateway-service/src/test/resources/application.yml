server:
  shutdown: graceful
  undertow:
    url-charset: UTF-8
  port: 80

public-endpoints:
  package-names:
    - com.michibaum.gatewayservice
  endpoints:
    - raw-path: /actuator/health/readiness
      request-method: GET
    - raw-path: /actuator/health/liveness
      request-method: GET

spring:
  threads:
    virtual:
      enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 20s
  application:
    name: gateway-service
  cloud:
    discovery:
      client:
        health-indicator:
          include-description: true
    openfeign:
      lazy-attributes-resolution: true
      httpclient:
        disable-ssl-validation: true
  main:
    allow-bean-definition-overriding: true
  boot:
    admin:
      service:
        username: admin_username
        password: admin_password

eureka:
  instance:
    prefer-ip-address: true
  client:
    enabled: false
    fetch-registry: true
    register-with-eureka: true
    refresh:
      enable: true
    restclient:
      enabled: true

management:
  services:
    jaeger-url: http://localhost:16686
    prometheus-url: http://localhost:9090
    grafana-url: http://localhost:3000
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: http://localhost:4317
          transport: grpc
          timeout: 2s
          connect-timeout: 1s
  tracing:
    export:
      enabled: false
  endpoints:
    access:
      default: unrestricted
    web:
      exposure:
        include: "*"
  endpoint:
    env:
      post:
        enabled: true
    health:
      show-details: always
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  info:
    git:
      mode: full
      enabled: true
    build:
      enabled: true
    defaults:
      enabled: true
    env:
      enabled: true
    java:
      enabled: true
    os:
      enabled: true
    process:
      enabled: true
    ssl:
      enabled: true

robots-txt:
  crawlers:
    -
      user-agent: "*"
      allowed:
        - "/"
        - "/*"
  sitemaps:
    - "/sitemap.xml"
sitemap-xml:
  https: true
  locations: []

gateway:
  publish:
    enabled: false
  static-routes:
    redirects:
      - hosts:
          - "babymetal.ch"
        status: TEMPORARY_REDIRECT
        target-url: "https://babymetal.com"
      - hosts:
          - "hanabie.ch"
        status: TEMPORARY_REDIRECT
        target-url: "https://hanabie.jp/en"
      - hosts:
          - "baumberger-software.ch"
          - "baumberger-software.com"
        status: TEMPORARY_REDIRECT
        target-url: "https://michibaum.ch/about-me"
      - hosts:
          - "einsiedeln.beer"
        status: NO_CONTENT
      - hosts:
          - "einsiedeln.shop"
          - "einsiedeln.store"
        status: NO_CONTENT
      - hosts:
          - "www.michibaum.{tld}"
        status: PERMANENT_REDIRECT
        scheme-host-template: "{scheme}://michibaum.{tld}"
        preserve-path-and-query: true
    external-services:
      - id: "jaeger-service"
        hosts:
          - "jaeger.michibaum.*"
        uri: ${management.services.jaeger-url}
        order: 0
        required-permissions:
          - ADMIN_SERVICE
      - id: "grafana-service"
        hosts:
          - "grafana.michibaum.*"
        uri: ${management.services.grafana-url}
        order: 0
        required-permissions:
          - ADMIN_SERVICE
      - id: "prometheus-service"
        hosts:
          - "prometheus.michibaum.*"
        uri: ${management.services.prometheus-url}
        order: 0
        required-permissions:
          - ADMIN_SERVICE

cors:
  base-allowed-origin-patterns:
    - http://localhost:[80,4200]
    - http://michibaum.ch:[80,4200]
    - http://*.michibaum.ch:[80,4200]
    - http://michibaum.com:[80,4200]
    - http://*.michibaum.com:[80,4200]
    - http://michibaum.eu:[80,4200]
    - http://*.michibaum.eu:[80,4200]
    - http://michibaum.org:[80,4200]
    - http://*.michibaum.org:[80,4200]
    - http://michibaum.app:[80,4200]
    - http://*.michibaum.app:[80,4200]
    - http://michibaum.me:[80,4200]
    - http://*.michibaum.me:[80,4200]
    - http://michibaum.net:[80,4200]
    - http://*.michibaum.net:[80,4200]
    - http://michibaum.info:[80,4200]
    - http://*.michibaum.info:[80,4200]
    - http://michibaum.xyz:[80,4200]
    - http://*.michibaum.xyz:[80,4200]