apiVersion: k0sctl.k0sproject.io/v1beta1
kind: Cluster
metadata:
  name: microservice-cluster
spec:
  hosts:
    - ssh:
        address: 5.75.129.76
        user: root
        port: 22
        keyPath: ~/.ssh/nbs2_root
      role: controller
      hostname: nbs2
    - ssh:
        address: 185.229.90.248
        user: root
        port: 22
        keyPath: ~/.ssh/35591_root
      role: controller+worker
      noTaints: true
      hostname: 35591.hostserv.eu
    - ssh:
        address: 91.99.143.250
        user: root
        port: 22
        keyPath: ~/.ssh/nbs1_root
      role: controller+worker
      noTaints: true
      hostname: nbs1
  options:
    wait:
      enabled: true
    drain:
      enabled: true
      gracePeriod: 2m0s
      timeout: 5m0s
      force: true
      ignoreDaemonSets: true
      deleteEmptyDirData: true
    concurrency:
      limit: 1
      workerDisruptionPercent: 10
      uploads: 5
    evictTaint:
      controllerWorkers: true
  k0s:
    # https://docs.k0sproject.io/head/upgrade/#upgrade-a-k0s-cluster-using-k0sctl
    version: v1.36.5+k0s.0
    dynamicConfig: false
    config:
      apiVersion: k0s.k0sproject.io/v1beta1
      kind: ClusterConfig
      metadata:
        name: microservice-cluster
      spec:
        extensions:
          helm:
            repositories:
              - name: traefik
                url: https://traefik.github.io/charts
              - name: metallb
                url: https://metallb.github.io/metallb
              - name: openebs
                url: https://openebs.github.io/charts
            charts:
              - name: openebs
                chartname: openebs/openebs
                version: "3.9.0"
                namespace: openebs
                order: 1
        network:
          nodeLocalLoadBalancing:
            enabled: true
            type: EnvoyProxy
        storage:
          type: etcd
        telemetry:
          enabled: false
