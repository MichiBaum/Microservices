apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: microservices
data:
  otel-collector-config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317

    processors:
      memory_limiter:
        check_interval: 5s
        limit_mib: 500
        spike_limit_mib: 100

      tail_sampling:
        decision_wait: 10s
        num_traces: 50000
        expected_new_traces_per_sec: 500
        policies:
          # Keep 100% of traces where any span has ERROR status (exceptions, HTTP 5xx, gRPC errors)
          - name: errors-policy
            type: status_code
            status_code:
              status_codes: [ERROR]

          # Optional: also keep HTTP 4xx responses (OTel marks 4xx as UNSET rather than ERROR)
          - name: http-4xx-policy
            type: ottl_condition
            ottl_condition:
              error_mode: ignore
              span:
                - 'attributes["http.response.status_code"] >= 400 or attributes["http.status_code"] >= 400'

          # Optional: keep slow traces (> 2s) even if they succeeded
          - name: slow-traces-policy
            type: latency
            latency:
              threshold_ms: 300

          # Fallback: keep 50% of all remaining (healthy) traces
          - name: probabilistic-policy
            type: probabilistic
            probabilistic:
              sampling_percentage: 50

      batch:

    exporters:
      otlp:
        endpoint: jaeger:4317
        tls:
          insecure: true

    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, tail_sampling, batch]
          exporters: [otlp]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  namespace: microservices
  labels:
    app: otel-collector
spec:
  replicas: 1
  selector:
    matchLabels:
      app: otel-collector
  template:
    metadata:
      labels:
        app: otel-collector
    spec:
      containers:
        - name: otel-collector
          image: otel/opentelemetry-collector-contrib:0.159.0
          args:
            - "--config=/etc/otel-collector/otel-collector-config.yaml"
          ports:
            - containerPort: 4317
              name: otlp-grpc
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "512Mi"
              cpu: "300m"
          volumeMounts:
            - name: config
              mountPath: /etc/otel-collector
      volumes:
      - name: config
        configMap:
          name: otel-collector-config
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  namespace: microservices
  labels:
    app: otel-collector
    sba-check: kubernetes
spec:
  selector:
    app: otel-collector
  ports:
  - name: otlp-grpc
    port: 4317
    targetPort: 4317
  type: ClusterIP
