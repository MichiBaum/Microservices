apiVersion: v1
kind: ServiceAccount
metadata:
  name: vpn-service-sa
  namespace: microservices
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: vpn-service-role
  namespace: microservices
rules:
- apiGroups: ["", "apps"]
  resources: ["pods", "pods/exec", "services", "endpoints", "configmaps", "deployments"]
  verbs: ["get", "list", "watch", "create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: vpn-service-rolebinding
  namespace: microservices
subjects:
- kind: ServiceAccount
  name: vpn-service-sa
  namespace: microservices
roleRef:
  kind: Role
  name: vpn-service-role
  apiGroup: rbac.authorization.k8s.io
