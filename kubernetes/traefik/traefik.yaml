apiVersion: helm.k0sproject.io/v1beta1
kind: Chart
metadata:
  name: traefik
  namespace: kube-system
spec:
  chartName: traefik/traefik
  releaseName: traefik
  version: "35.3.0"
  namespace: traefik-system
  values: |
    hostNetwork: true
    deployment:
      dnsPolicy: ClusterFirstWithHostNet
    securityContext:
      capabilities:
        drop: [ALL]
        add: [NET_BIND_SERVICE]
      readOnlyRootFilesystem: true
      runAsGroup: 0
      runAsNonRoot: false
      runAsUser: 0
    nodeSelector:
      kubernetes.io/hostname: 35591.hostserv.eu
    service:
      type: ClusterIP
    ports:
      traefik:
        port: 9000
      metrics:
        port: 9100
        expose:
          default: true
        exposedPort: 9100
      web:
        port: 80
        expose:
          default: true
        exposedPort: 80
        protocol: TCP
      websecure:
        port: 443
        expose:
          default: true
        exposedPort: 443
        protocol: TCP
    metrics:
      prometheus:
        entryPoint: metrics
        addRouters: true
    tracing:
      addInternals: true
      otlp:
        enabled: true
        grpc:
          enabled: true
          insecure: true
          endpoint: otel-collector.microservices.svc.cluster.local:4317
    tlsStore:
      default:
        defaultCertificate:
          secretName: cert-michibaum-ch
        certificates:
          - secretName: cert-michibaum-ch
          - secretName: cert-michibaum-com
          - secretName: cert-michibaum-eu
          - secretName: cert-michibaum-org
          - secretName: cert-michibaum-me
          - secretName: cert-michibaum-net
          - secretName: cert-michibaum-info
          - secretName: cert-michibaum-xyz
          - secretName: cert-baumberger-software-ch