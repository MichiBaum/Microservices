servers:
  zerossl:
    url: https://acme.zerossl.com/v2/DV90

accounts:
  default:
    email: YOUR_EMAIL@GMAIL.COM
    server: zerossl

challenges:
  hosttech-dns:
    dns:
      provider: hosttech
      envFile: .env.hosttech
      resolvers:
        - "1.1.1.1:53"

certificates:
  michibaum-ch:
    challenge: hosttech-dns
    domains:
      - michibaum.ch
      - "*.michibaum.ch"

  michibaum-com:
    challenge: hosttech-dns
    domains:
      - michibaum.com
      - "*.michibaum.com"

  michibaum-eu:
    challenge: hosttech-dns
    domains:
      - michibaum.eu
      - "*.michibaum.eu"

  michibaum-org:
    challenge: hosttech-dns
    domains:
      - michibaum.org
      - "*.michibaum.org"

  michibaum-me:
    challenge: hosttech-dns
    domains:
      - michibaum.me
      - "*.michibaum.me"

  michibaum-net:
    challenge: hosttech-dns
    domains:
      - michibaum.net
      - "*.michibaum.net"

  michibaum-info:
    challenge: hosttech-dns
    domains:
      - michibaum.info
      - "*.michibaum.info"

  michibaum-xyz:
    challenge: hosttech-dns
    domains:
