<div class="container mx-auto px-4 py-8 max-w-6xl">
  <div class="mb-8">
    <h1 class="text-3xl font-bold text-surface-900 dark:text-surface-0 m-0">
      {{ 'settings.title' | translate }}
    </h1>
    <p class="text-surface-600 dark:text-surface-400 mt-2 mb-0">
      {{ 'settings.meta-description' | translate }}
    </p>
  </div>

  <div class="flex flex-col md:flex-row gap-6">
    <aside class="w-full md:w-64 shrink-0">
      <nav [attr.aria-label]="'settings.nav.aria-label' | translate" class="bg-surface-0 dark:bg-surface-900 rounded-xl p-2 border border-surface-200 dark:border-surface-700 shadow-sm">
        <ul class="flex flex-row md:flex-col gap-1 p-0 m-0 list-none overflow-x-auto">
          @for (item of navItems; track item.routerLink) {
            <li>
              <a
                [routerLink]="item.routerLink"
                routerLinkActive="bg-primary text-primary-contrast font-medium shadow-xs"
                [routerLinkActiveOptions]="{ exact: false }"
                class="flex items-center gap-3 px-4 py-3 rounded-lg text-surface-700 dark:text-surface-200 hover:bg-surface-100 dark:hover:bg-surface-800 transition-colors duration-150 no-underline whitespace-nowrap cursor-pointer"
              >
                <fa-icon [icon]="item.icon"></fa-icon>
                <span>{{ item.label | translate }}</span>
              </a>
            </li>
          }
        </ul>
      </nav>
    </aside>

    <main class="flex-1 min-w-0">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
